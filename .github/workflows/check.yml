# The one gate. `npm run check` is what runs locally, so CI running anything
# else would be a second definition of "passing" to keep in sync.
#
# ffmpeg is installed because the end-to-end test needs it — that test runs the
# real binary at an emulated Cast device and is the only one that exercises the
# inversion this tool is built around. It skips silently where ffmpeg is
# missing, which is convenient locally and useless in CI, so CI provides it.

name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The end-to-end test skips without these, and a test that never runs is
      # not a test. openssl is already present on the runner.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm ci

      # typecheck, lint, architecture rules, codegen drift, tests
      - run: npm run check

      # The bundle is what `npm i -g` installs, so a build that has broken is
      # worth knowing about before someone tries to install it.
      - run: npm run build:cli
